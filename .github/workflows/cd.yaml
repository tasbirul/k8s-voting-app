name: Deploy to K8s Node

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # New step: Clean up the remote directory to prevent stale files
    - name: Clean remote directory
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.MASTER_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: rm -rf ~/k8s-specifications

    - name: Copy manifest to master node
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.MASTER_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: "k8s-specifications"
        target: "~/"
        
    - name: Apply manifest and verify deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.MASTER_IP }}
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Use apply instead of create for idempotency
          kubectl apply -f k8s-specifications/
          
          # Wait for rollouts
          kubectl rollout status deployment/vote --timeout=120s
          kubectl rollout status deployment/result --timeout=120s
          kubectl rollout status deployment/worker --timeout=120s
          kubectl rollout status deployment/redis --timeout=120s
          kubectl rollout status deployment/postgres --timeout=120s
          
          kubectl get pods,svc