name: GitOps CI - Voting App

on:
  push:
    branches: [ dev ]
    # The pipeline only triggers if code in these specific folders is changed
    paths:
      - 'vote/**'
      - 'result/**'
      - 'worker/**'

jobs:
  # JOB 1: Build and Push Images in Parallel
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, result, worker]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Detect if THIS specific service in the matrix changed
      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed: ['./${{ matrix.service }}/**']

      # 2. Login to Docker Hub (Only if changes detected)
      - name: Login to Docker Hub
        if: steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build and Push (Tagged with the unique Git SHA)
      - name: Build and Push Image
        if: steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/voting-app-${{ matrix.service }}:${{ github.sha }}

  # JOB 2: Update Kubernetes Manifests Safely
  update-manifests:
    needs: build-images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0

      # 1. Run the path filter again to see exactly what changed in this entire commit
      - name: Detect Changed Services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vote: ['vote/**']
            result: ['result/**']
            worker: ['worker/**']

      # 2. Conditionally update only the YAML files that have a newly built image
      - name: Update YAML files and Push to Git
        run: |
          # Setup Git Bot Identity
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Conditionally update Vote
          if [ "${{ steps.filter.outputs.vote }}" == "true" ]; then
            echo "Updating Vote manifest..."
            sed -i "s|image: .*voting-app-vote:.*|image: ${{ secrets.DOCKER_USERNAME }}/voting-app-vote:${{ github.sha }}|g" k8s-specifications/vote-deployment.yaml
          fi
          
          # Conditionally update Result
          if [ "${{ steps.filter.outputs.result }}" == "true" ]; then
            echo "Updating Result manifest..."
            sed -i "s|image: .*voting-app-result:.*|image: ${{ secrets.DOCKER_USERNAME }}/voting-app-result:${{ github.sha }}|g" k8s-specifications/result-deployment.yaml
          fi
          
          # Conditionally update Worker
          if [ "${{ steps.filter.outputs.worker }}" == "true" ]; then
            echo "Updating Worker manifest..."
            sed -i "s|image: .*voting-app-worker:.*|image: ${{ secrets.DOCKER_USERNAME }}/voting-app-worker:${{ github.sha }}|g" k8s-specifications/worker-deployment.yaml
          fi
          
          # Stage the updated YAML files
          git add k8s-specifications/*.yaml
          
          # Check if there are actually changes to commit (prevents empty commit errors)
          if git diff --staged --quiet; then
            echo "No manifest changes required. Exiting cleanly."
          else
            git commit -m "chore: update K8s manifests for GitOps to SHA ${{ github.sha }}"
            git push origin dev
            echo "Successfully pushed updated manifests to dev branch!"
          fi