name: DevSecOps CI Pipeline - Voting App

on:
  push:
    branches: [ dev ]
    paths:
      - 'vote/**'
      - 'result/**'
      - 'worker/**'
      - 'k8s-specifications/**'
  workflow_dispatch: 

jobs:
  # JOB 1: REPOSITORY SECURITY & IAC LINTING
  repo-security:
    name: Secret & IaC Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks needs full history to scan properly

      # 1. Secret Scanning (Gitleaks)
      - name: Scan for Leaked Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. IaC Security Scan (Kube-linter)
      - name: Scan Kubernetes Manifests
        uses: stackrox/kube-linter-action@v1.0.4
        with:
          directory: k8s-specifications

  # JOB 2: BUILD, SCAN, AND PUSH
  build-and-scan:
    name: Build & Vulnerability Scan
    needs: repo-security # Only run if repo-security passes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, result, worker]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changed: ['./${{ matrix.service }}/**']

      # 3. Dockerfile Linting (Hadolint)
      - name: Lint Dockerfile
        if: steps.filter.outputs.changed == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./${{ matrix.service }}/Dockerfile

      # Set up Docker Buildx (required for advanced building)
      - name: Set up Docker Buildx
        if: steps.filter.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      # Build the image, but DO NOT push it yet. Load it locally for scanning.
      - name: Build Image Locally
        if: steps.filter.outputs.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          load: true # <--- This keeps the image on the runner instead of pushing
          tags: ${{ secrets.DOCKER_USERNAME }}/voting-app-${{ matrix.service }}:${{ github.sha }}

      # 4. Container Vulnerability Scanning (Trivy)
      - name: Run Trivy Vulnerability Scanner
        if: steps.filter.outputs.changed == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/voting-app-${{ matrix.service }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # Only login and push IF the Trivy scan passes!
      - name: Login to Docker Hub
        if: steps.filter.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Clean Image to Docker Hub
        if: steps.filter.outputs.changed == 'true'
        run: docker push ${{ secrets.DOCKER_USERNAME }}/voting-app-${{ matrix.service }}:${{ github.sha }}

  # JOB 3: GITOPS MANIFEST UPDATE
  update-manifests:
    name: Update K8s Manifests
    needs: build-and-scan # Only run if all images build and pass security scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Use default token
          fetch-depth: 0

      - name: Detect Changed Services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vote: ['vote/**']
            result: ['result/**']
            worker: ['worker/**']

      - name: Update YAML files and Push to Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          if [ "${{ steps.filter.outputs.vote }}" == "true" ]; then
            sed -i -E "s|image: .*vote.*|image: ${{ secrets.DOCKER_USERNAME }}/voting-app-vote:${{ github.sha }}|g" k8s-specifications/vote-deployment.yaml
          fi
          
          if [ "${{ steps.filter.outputs.result }}" == "true" ]; then
            sed -i -E "s|image: .*result.*|image: ${{ secrets.DOCKER_USERNAME }}/voting-app-result:${{ github.sha }}|g" k8s-specifications/result-deployment.yaml
          fi
          
          if [ "${{ steps.filter.outputs.worker }}" == "true" ]; then
            sed -i -E "s|image: .*worker.*|image: ${{ secrets.DOCKER_USERNAME }}/voting-app-worker:${{ github.sha }}|g" k8s-specifications/worker-deployment.yaml
          fi
          
          git add k8s-specifications/*.yaml
          
          if git diff --staged --quiet; then
            echo "No manifest changes required."
          else
            git commit -m "chore: secure GitOps update to SHA ${{ github.sha }}"
            git push origin dev
          fi