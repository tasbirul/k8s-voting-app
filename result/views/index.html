<!DOCTYPE html>
<html ng-app="catsvsdogs" lang="en">

<head>
  <meta charset="utf-8">
  <title>Docker vs Podman - Live Results</title>
  <base href="/index.html">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="docker-compose, docker, podman, stack">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css">

  <style>
    /* --- Core Theme & Variables --- */
    :root {
      --color-a: rgba(36, 150, 237, 0.9);
      /* Docker Blue */
      --color-b: rgba(137, 44, 160, 0.9);
      /* Podman Purple */
      --bg-dark: #0f172a;
      --text-main: #f8fafc;
    }

    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      /* Keeps the dynamic background neatly contained */
    }

    /* --- Live Split Background --- */
    /* app.js dynamically adjusts the width of these child divs */
    #background-stats {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: flex;
    }

    #background-stats-1 {
      background: linear-gradient(135deg, #1e3a8a, var(--color-a));
      height: 100%;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: inset -15px 0 30px rgba(0, 0, 0, 0.3);
    }

    #background-stats-2 {
      background: linear-gradient(135deg, #4c1d95, var(--color-b));
      height: 100%;
      transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* --- Glassmorphism Foreground --- */
    #content-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      /* Allows interactions to pass through to background if needed */
    }

    #content-container-center {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 4rem 5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(255, 255, 255, 0.05);
      text-align: center;
      min-width: 500px;
      animation: popIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* --- Stats Layout --- */
    #choice {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4rem;
    }

    .choice {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .label {
      font-size: 1.5rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 0.5rem;
    }

    .stat {
      font-size: 5rem;
      font-weight: 800;
      text-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    /* Mapping colors to the existing classes */
    .cats .stat {
      color: #60a5fa;
    }

    /* Highlight Blue */
    .dogs .stat {
      color: #c084fc;
    }

    /* Highlight Purple */

    .divider {
      width: 2px;
      height: 100px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    /* --- Total Votes Counter --- */
    #result {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      padding: 0.8rem 2rem;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      animation: fadeUp 1s ease-out;
    }

    /* --- Animations & Responsive --- */
    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.9) translateY(30px);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translate(-50%, 20px);
      }

      100% {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @media (max-width: 600px) {
      #content-container-center {
        min-width: 90%;
        padding: 2.5rem 1.5rem;
      }

      .stat {
        font-size: 3.5rem;
      }

      #choice {
        gap: 2rem;
      }

      .divider {
        height: 70px;
      }
    }
  </style>
</head>

<body ng-controller="statsCtrl">

  <div id="background-stats">
    <div id="background-stats-1"></div>
    <div id="background-stats-2"></div>
  </div>

  <div id="content-container">
    <div id="content-container-center">
      <div id="choice">
        <div class="choice cats">
          <div class="label">Docker</div>
          <div class="stat">{{aPercent | number:1}}%</div>
        </div>

        <div class="divider"></div>

        <div class="choice dogs">
          <div class="label">Podman</div>
          <div class="stat">{{bPercent | number:1}}%</div>
        </div>
      </div>
    </div>
  </div>

  <div id="result">
    <span ng-if="total == 0">Waiting for votes...</span>
    <span ng-if="total == 1"><i class="fa fa-bar-chart"></i> {{total}} Vote Cast</span>
    <span ng-if="total >= 2"><i class="fa fa-bar-chart"></i> {{total}} Total Votes</span>
  </div>

  <script src="socket.io.js"></script>
  <script src="angular.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
