
---
# =============================================================================
# site.yml — Full Kubernetes Cluster Provisioning Playbook
# =============================================================================
# Execution Order:
#   Play 1 → common role on ALL nodes (containerd + k8s components)
#   Play 2 → kubernetes_master role on master (kubeadm init + CNI + join cmd)
#   Play 3 → kubernetes_worker role on workers (kubeadm join using master's fact)
#
# Run with:
#   ansible-playbook playbooks/site.yml
#
# Dry-run (check mode):
#   ansible-playbook playbooks/site.yml --check
# =============================================================================

# -----------------------------------------------------------------------------
# Play 1: System prerequisites and Kubernetes components on ALL nodes
# -----------------------------------------------------------------------------
- name: "Play 1 | Configure common prerequisites on all nodes"
  hosts: tag_Role_master:tag_Role_worker
  become: true
  gather_facts: true
  roles:
    - role: common

# -----------------------------------------------------------------------------
# Play 2: Initialize the Kubernetes control-plane on the master node
# -----------------------------------------------------------------------------
- name: "Play 2 | Initialize Kubernetes master node"
  hosts: tag_Role_master
  become: true
  gather_facts: true
  roles:
    - role: kubernetes_master

# -----------------------------------------------------------------------------
# Play 3: Join worker nodes to the cluster
# The join command is captured as a fact during Play 2 and referenced here
# via hostvars from the master host.
# -----------------------------------------------------------------------------
- name: "Play 3 | Join worker nodes to the cluster"
  hosts: tag_Role_worker
  become: true
  gather_facts: true
  roles:
    - role: kubernetes_worker


# -----------------------------------------------------------------------------
# Play 4: Install ArgoCD on the master node
# -----------------------------------------------------------------------------
- name: "Play 4 | Install ArgoCD"
  hosts: tag_Role_master
  become: true
  gather_facts: true
  roles:
    - role: argocd

# -----------------------------------------------------------------------------
# Play 5: Install Prometheus + Grafana monitoring stack on the master node
# Uses kube-prometheus-stack Helm chart (includes Grafana, node-exporter,
# kube-state-metrics, and Alertmanager).
#
# Secrets: reads GRAFANA_ADMIN_PASSWORD from ansible/.env on the Ansible
# control node (your local machine). The .env file is git-ignored.
# -----------------------------------------------------------------------------
- name: "Play 5 | Install Prometheus + Grafana monitoring stack"
  hosts: tag_Role_master
  become: true
  gather_facts: true

  pre_tasks:
    - name: "Monitoring | Read GRAFANA_ADMIN_PASSWORD from .env on controller"
      ansible.builtin.set_fact:
        grafana_admin_password: >-
          {{
            lookup('ansible.builtin.file', playbook_dir + '/../.env')
            | regex_findall('(?m)^GRAFANA_ADMIN_PASSWORD=(.+)$')
            | first
            | trim
          }}
      delegate_to: localhost
      run_once: true
      no_log: true

    - name: "Monitoring | Fail if GRAFANA_ADMIN_PASSWORD is not set in .env"
      ansible.builtin.fail:
        msg: >
          GRAFANA_ADMIN_PASSWORD is empty or missing in ansible/.env.
          Run: echo 'GRAFANA_ADMIN_PASSWORD=<your-password>' >> ansible/.env
      when: grafana_admin_password | length == 0

  roles:
    - role: prometheus