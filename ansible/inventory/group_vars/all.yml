---
# Global variables shared across ALL nodes (master and worker).
# Override in role-specific group_vars files as needed.

# ── Kubernetes ──────────────────────────────────────────────────────────────
k8s_version: "1.28"

# Pod network CIDR — must match the CNI plugin's expected range.
# 192.168.0.0/16 is the Calico default.
pod_network_cidr: "192.168.0.0/16"

# ── Calico CNI ───────────────────────────────────────────────────────────────
calico_version: "v3.26.1"
calico_manifest_url: "https://raw.githubusercontent.com/projectcalico/calico/{{ calico_version }}/manifests/calico.yaml"

# ── Container Runtime ────────────────────────────────────────────────────────
containerd_config_path: /etc/containerd/config.toml

# ── System ───────────────────────────────────────────────────────────────────
# The non-root user on the Ubuntu AMI who will own the kubeconfig
kube_user: ubuntu
kube_user_home: /home/ubuntu
