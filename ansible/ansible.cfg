[defaults]
# Path to the dynamic inventory and roles
inventory          = inventory/
roles_path         = roles/

# Connect as the ubuntu user (default for Ubuntu AMIs on AWS)
remote_user        = ubuntu

# Path to your SSH private key — update this to match your actual .pem location
private_key_file   = ~/Documents/aws-vm-ssh-key.pem

# Disable host key checking for ephemeral EC2 nodes (IPs change between provisions)
host_key_checking  = False
interpreter_python = auto_silent

# Use YAML output for readability (Ansible 2.13+ syntax)
stdout_callback    = ansible.builtin.default
result_format      = yaml
callbacks_enabled  = timer, profile_tasks

# Suppress deprecation warnings from the amazon.aws collection
deprecation_warnings = False

[inventory]
# Enable the AWS EC2 dynamic inventory plugin from the amazon.aws collection
enable_plugins = amazon.aws.aws_ec2

[ssh_connection]
# Prevent "Shared connection to host closed" issues with pipelining
pipelining         = True
ssh_args           = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
