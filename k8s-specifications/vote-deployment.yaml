apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: tasbirul/voting-app-vote:1b89588845f27431336dba488dd9cd9ec2bf2eef
        name: vote
        ports:
        - containerPort: 80
          name: vote
