apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: tasbirul/examplevotingapp_vote:15cda29d8ed15d82d7604afa05d3d5c2be18e05d
        name: vote
        ports:
        - containerPort: 80
          name: vote
