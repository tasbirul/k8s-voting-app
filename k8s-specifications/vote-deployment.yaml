apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: tasbirul/voting-app-vote:d4b4033e6dfc59d6ed9590c228f691e577963d14
        name: vote
        ports:
        - containerPort: 80
          name: vote
