apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: tasbirul/voting-app-vote:5306a501f07fafd7d7d745093b4672d913b42db9
        name: vote
        ports:
        - containerPort: 80
          name: vote
