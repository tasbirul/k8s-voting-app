apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: tasbirul/examplevotingapp_vote:f81dd734927f7746bf2910d018f5aca7575fde7d
        name: vote
        ports:
        - containerPort: 80
          name: vote
