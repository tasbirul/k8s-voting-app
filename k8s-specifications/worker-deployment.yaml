    app: worker
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - image: tasbirul/voting-app-worker:5306a501f07fafd7d7d745093b4672d913b42db9
        name: worker
