apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: result
  name: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
      - image: tasbirul/voting-app-result:88f0d36d20ebe0144a03d41b028708de2b584404
        name: result
        ports:
        - containerPort: 80
          name: result
