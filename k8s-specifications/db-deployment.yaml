apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: db
  name: db
  annotations:
    ignore-check.kube-linter.io/run-as-non-root: "Init container requires temporary root access to chown the Postgres data volume."
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      securityContext:
        fsGroup: 999
        runAsNonRoot: true
        runAsUser: 999

      initContainers:
      - name: fix-permissions
        image: busybox:stable
        command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data"]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          readOnlyRootFilesystem: true 
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "50m"
            memory: "64Mi"
        volumeMounts:
        - name: db-data
          mountPath: /var/lib/postgresql/data

      containers:
      - image: postgres:15-alpine
        name: postgres
        securityContext:
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_INITDB_ARGS
          value: "--auth-host=md5 --auth-local=md5"
        ports:
        - containerPort: 5432
          name: postgres
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: db-data
        - mountPath: /var/run/postgresql
          name: pg-run
        - mountPath: /tmp
          name: tmp-volume
      volumes:
      - name: db-data
        emptyDir: {}
      - name: pg-run
        emptyDir: {}
      - name: tmp-volume
        emptyDir: {}